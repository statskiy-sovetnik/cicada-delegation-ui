# Конфигурация целиком, а не фрагмент conf.d: nginx работает не от root, и
# путь к pid и временным каталогам должен указывать на доступные на запись
# места.

worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Журнал в поток контейнера, а не в файл.
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  server_tokens off;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    # 8080, а не 80: порты ниже 1024 недоступны процессу без root.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Конфигурация среды и точка входа кешироваться не должны: иначе браузер
    # после обновления образа продолжит ходить на прежний Executor.
    location = /env.js {
      add_header cache-control "no-store" always;
    }

    location = /index.html {
      add_header cache-control "no-store" always;
    }

    # Имена файлов сборки содержат хеш содержимого — их можно кешировать навсегда.
    location /assets/ {
      add_header cache-control "public, max-age=31536000, immutable" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
